[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuthos"
version = "0.1.0"
description = "Neutron Source Definition and TH Damage Assessment"
authors = [{name = "Daniele Timpano"}]
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
